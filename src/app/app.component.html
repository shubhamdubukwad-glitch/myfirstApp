<h1 class="bg-primary text-center ">Shubham Dubukwad..!!!</h1>

<div class="container">
  <h1>skills list..!!!</h1>
  <div class="row">
    <div class="col-12">
      <ul class="list-group mb-2 ">
        <li *ngFor="let skills of skills" class="list-group-item "> I love {{skills}}
        </li>
      </ul>
    </div>

    <div class="col-12">
      <h1>Fruites list..!!!</h1>
      <ul class="list-group mt-2 ">
        <li *ngFor="let fruits of fruits" class="list-group-item "> {{fruits}}
        </li>
      </ul>
    </div>

    <div class="col-12">
      <h1>city list..!!!</h1>
      <ul class="list-group">
        <li *ngFor="let city of city" class="list-group-item"> I love {{city}}..!!
        </li>
      </ul>
    </div>
  </div>
</div>
